name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint API
        run: ruff check api/
      - name: Lint Orchestrator
        run: ruff check orchestrator/

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest httpx
      - name: Run API tests
        env:
          ORCHESTRA_DB: ":memory:"
        run: pytest api/ -v --tb=short
